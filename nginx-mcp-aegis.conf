# nginx location block for the Aegis read-only MCP server.
#
# Append this INSIDE the existing `server { server_name mcp.<DOMAIN>; ... }`
# umbrella vhost on the MCP host, after the `.well-known` bypass. Generated from the
# byteforge `mcp-server-nginx-gatekeeper` skill (brownfield path).
#
# Prerequisites the host must already satisfy — all three are existing-vhost
# invariants, so if another MCP already serves from this vhost they hold:
#
#   1. `resolver 127.0.0.11 valid=10s ipv6=off;` visible to the server block.
#      The snippet's `proxy_pass http://$mcp_upstream:$mcp_port` defers DNS to
#      request time and fails with "no resolver defined" (502) without it.
#   2. `conf.d/snippets/auth-gatekeeper.conf` present, defining the internal
#      `location = /auth`. Do not redefine /auth here.
#   3. The shared MCP location snippet present. NOTE THE NAME — the skill's
#      generic template calls it `mcp-location.conf`, but a host may carry
#      several variants and the right one depends on how that vhost
#      authenticates. On the host this was first deployed to there is a
#      gatekeeper-protected `mcp-location-heimdall.conf` (auth_request goes
#      tailscale-direct to the Gatekeeper) and a `mcp-location-noauth.conf`,
#      and no plain `mcp-location.conf` at all. Check what the sibling
#      `/mcp-*` blocks on the target vhost actually include rather than
#      trusting the name below.
#
# Also required once per umbrella vhost, before any `location /mcp-*`:
#
#   location ~ ^/mcp-[^/]+/\.well-known/ {
#       return 404;
#   }
#
# That 404 forces MCP clients to fall back to the static bearer token instead
# of negotiating OAuth. Gatekeeper does the auth; this MCP server has no
# concept of authentication at all, which is why it must never be reachable
# except through here.

# Aegis read-only MCP server
location /mcp-aegis {
    set $mcp_upstream byteforge-aegis-mcp;
    set $mcp_port     8000;

    # Three rewrites, not one, on purpose: the bare path, the trailing-slash
    # path, and everything below it all have to land on the upstream's single
    # absolute /mcp endpoint.
    rewrite ^/mcp-aegis$       /mcp break;
    rewrite ^/mcp-aegis/$      /mcp break;
    rewrite ^/mcp-aegis/(.+)   /$1  break;

    # Match whatever the sibling /mcp-* blocks on this vhost include — see
    # prerequisite 3 above. This is the gatekeeper-protected variant; the
    # name differs per host, and getting it wrong fails the config test
    # rather than silently serving unauthenticated, which is the safe way
    # for it to be wrong.
    include /etc/nginx/conf.d/snippets/mcp-location-heimdall.conf;
}
